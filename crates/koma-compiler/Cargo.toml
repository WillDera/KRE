[package]
name = "koma-compiler"
description = "Koma compiler: converts KIR into reproducible .koma packages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
koma-core = { path = "../koma-core" }
koma-theme = { path = "../koma-theme" }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }