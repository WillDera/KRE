[package]
name = "koma-epub"
description = "Koma EPUB content adapter: converts EPUB packages into KIR."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
koma-core = { path = "../../koma-core" }
roxmltree = "0.20"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"