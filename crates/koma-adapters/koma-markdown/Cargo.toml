[package]
name = "koma-markdown"
description = "Koma Markdown content adapter: converts Markdown into KIR."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
koma-core = { path = "../../koma-core" }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
