[package]
name = "koma-renderer"
description = "Koma renderer: backend abstraction and text rendering (Phase 4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
cosmic-text = "0.13"
fontdb = "0.16"
koma-core = { path = "../koma-core" }
koma-scene = { path = "../koma-scene" }
koma-theme = { path = "../koma-theme" }
swash = "0.2"
thiserror = "2"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"