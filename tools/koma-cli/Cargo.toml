[package]
name = "koma-cli"
description = "Koma Rendering Engine developer toolchain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "koma"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
koma-compiler = { path = "../../crates/koma-compiler" }
koma-core = { path = "../../crates/koma-core" }
koma-analysis = { path = "../../crates/koma-analysis" }
koma-epub = { path = "../../crates/koma-adapters/koma-epub" }
koma-markdown = { path = "../../crates/koma-adapters/koma-markdown" }
koma-renderer = { path = "../../crates/koma-renderer" }
koma-server = { path = "../../crates/koma-server" }
koma-theme = { path = "../../crates/koma-theme" }
png = "0.17"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }